<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Vibrant Check / Wave Gradient -->
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Wave Blue/Cyan Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base App Icon Shape -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#rim)" stroke-width="4" opacity="0.6"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>

  <!-- Audio Wave Bars (Voice Capture representation) -->
  <g opacity="0.85">
    <rect x="100" y="220" width="18" height="72" rx="9" fill="url(#waveGrad)" opacity="0.5"/>
    <rect x="134" y="180" width="18" height="152" rx="9" fill="url(#waveGrad)" opacity="0.75"/>
    <rect x="360" y="190" width="18" height="132" rx="9" fill="url(#waveGrad)" opacity="0.75"/>
    <rect x="394" y="230" width="18" height="52" rx="9" fill="url(#waveGrad)" opacity="0.5"/>
  </g>

  <!-- Glowing Fast-Capture Checkmark (Task & Execution) -->
  <path d="M168 268 L232 332 L344 180"
        fill="none"
        stroke="url(#accent)"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Core Line for Razor-Sharp Clarity -->
  <path d="M168 268 L232 332 L344 180"
        fill="none"
        stroke="#ffffff"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"/>

  <!-- Spark / Clock Reminder Dot (Top Right) -->
  <circle cx="370" cy="140" r="18" fill="#fbbf24" filter="url(#glow)"/>
  <circle cx="370" cy="140" r="8" fill="#ffffff"/>
</svg>